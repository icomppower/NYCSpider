<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NYC Spider</title>
  <link rel="stylesheet" href="/src/ui/style.css" />
</head>
<body>
  <div id="app"></div>
  <div id="hud">
    <div id="hp"><div id="hp-fill"></div></div>
    <div id="suit-tag"></div>
    <div id="combo"></div>
    <div id="alert"></div>
    <div id="crime"></div>
    <div id="toast"></div>
    <canvas id="minimap" width="180" height="180"></canvas>
    <div id="reticle"></div>
    <div id="debug"></div>
    <div id="flash"></div>
    <div id="help">WASD 移動 · Space 跳躍 · Shift 擺盪/跑酷 · 左鍵 攻擊（空中可連段） · 右鍵/R 上勾拳挑空 · E 蛛絲拉扯 · F 蛛絲衝刺 · Tab 戰衣選單</div>
  </div>
  <div id="menu" class="hidden">
    <h1>戰衣</h1>
    <div id="suit-cards"></div>
    <p class="hint">Tab / Esc 關閉</p>
  </div>
  <div id="loading">載入中…</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
